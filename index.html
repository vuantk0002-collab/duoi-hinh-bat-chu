            <p class="text-md text-gray-400 mb-4" id="final-class"></p>
            <div class="w-full h-px bg-white/20 my-4"></div>
            <p class="text-sm text-brand-light uppercase tracking-widest font-bold">Tổng Điểm Của Em</p>
            <p id="final-score" class="text-7xl font-black text-brand-pink title-font mt-2 text-glow"></p>
        </div>
        <button onclick="location.reload()" class="w-full bg-white text-brand-dark font-bold py-3 rounded-xl hover:bg-gray-200 transition">
            Chơi Lại Từ Đầu
        </button>
    </div>

    <!-- PLAYER LOGIC SCRIPT -->
    <script>
        const VNI_ALPHABET = "AĂÂBCDĐEÊGHIKLMNOÔƠPQRSTUƯVXY";
        let currentQuestionIdx = 0;
        let totalScore = 0;
        let timerInterval;
        let timeLeft = 0;
        let answerSlots = []; 
        let poolChars = []; 

        // --- CÔNG CỤ TẠO ÂM THANH (WEB AUDIO API) ---
        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, type, duration, vol=0.1) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        const sfx = {
            click: () => playTone(600, 'sine', 0.1, 0.05), // Tiếng click nhẹ
            correct: () => { // Chuỗi tiếng ting ting ting khi đúng
                playTone(440, 'sine', 0.1, 0.1);
                setTimeout(() => playTone(554, 'sine', 0.1, 0.1), 100);
                setTimeout(() => playTone(659, 'sine', 0.2, 0.1), 200);
                setTimeout(() => playTone(880, 'sine', 0.4, 0.15), 300);
            },
            wrong: () => { // Tiếng bíp trầm khi sai
                playTone(200, 'sawtooth', 0.3, 0.1);
                setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 150);
            }
        };

        document.getElementById('btn-start').addEventListener('click', () => {
            const name = document.getElementById('stu-name').value.trim();
            const cls = document.getElementById('stu-class').value.trim();
            
            if(!name || !cls) {
                alert('Vui lòng nhập đầy đủ Họ Tên và Lớp nhé!');
                return;
            }

            initAudio(); // Khởi tạo âm thanh
            sfx.click();

            document.getElementById('display-name').textContent = name;
            document.getElementById('final-name').textContent = name;
            document.getElementById('final-class').textContent = 'Lớp: ' + cls;

            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('flex');

            loadQuestion();
        });

        function loadQuestion() {
            const game = window.GAME_DATA[currentQuestionIdx];
            timeLeft = game.timeLimit;
            document.getElementById('timer').textContent = timeLeft;
            document.getElementById('timer').classList.replace('text-red-500', 'text-brand-pink');
            document.getElementById('question-progress').textContent = 'Câu ' + (currentQuestionIdx + 1) + '/' + window.GAME_DATA.length;
            document.getElementById('display-score').textContent = 'Điểm: ' + totalScore;
            document.getElementById('hint-image').src = game.image;
            
            answerSlots = [];
            let pureChars = [];
            
            const normalizedAns = game.answer.toUpperCase().replace(/\s+/g, ' ').trim();
            const words = normalizedAns.split(' ');
            
            words.forEach((word, wIdx) => {
                for(let i=0; i<word.length; i++) {
                    answerSlots.push({ expected: word[i], current: null, poolIndex: null, isSpace: false });
                    pureChars.push(word[i]);
                }
                if(wIdx < words.length - 1) {
                    answerSlots.push({ isSpace: true }); 
                }
            });

            // Sinh random kí tự, tổng số ô gợi ý bên dưới là 14 (hoặc lớn hơn nếu câu hỏi quá dài)
            const poolSize = Math.max(14, pureChars.length + 4);
            poolChars = pureChars.map(c => ({ char: c, used: false }));
            
            while(poolChars.length < poolSize) {
                poolChars.push({ char: VNI_ALPHABET[Math.floor(Math.random() * VNI_ALPHABET.length)], used: false });
            }
            
            poolChars.sort(() => Math.random() - 0.5); // Đảo lộn vị trí

            renderBoard();
            startTimer();
        }

        function renderBoard() {
            const slotsContainer = document.getElementById('answer-slots');
            slotsContainer.innerHTML = '';
            
            let currentWordDiv = document.createElement('div');
            currentWordDiv.className = 'flex gap-1 md:gap-2 mx-2';
            
            answerSlots.forEach((slot, idx) => {
                if (slot.isSpace) {
                    slotsContainer.appendChild(currentWordDiv);
                    currentWordDiv = document.createElement('div');
                    currentWordDiv.className = 'flex gap-1 md:gap-2 mx-2'; 
                } else {
                    const box = document.createElement('div');
                    const hasLetterClass = slot.current ? 'bg-gradient-to-b from-brand-light to-brand-dark text-white shadow-[0_0_10px_rgba(6,182,212,0.8)] border-2 border-brand-light scale-105' : 'bg-black/40 border-b-4 border-brand/50 text-transparent';
                    box.className = 'w-9 h-11 md:w-12 md:h-14 rounded-lg flex items-center justify-center text-2xl md:text-3xl font-bold cursor-pointer transition-all ' + hasLetterClass;
                    box.textContent = slot.current || '';
                    box.onclick = () => removeLetter(idx);
                    currentWordDiv.appendChild(box);
                }
            });
            slotsContainer.appendChild(currentWordDiv); 

            const poolContainer = document.getElementById('letter-pool');
            poolContainer.innerHTML = '';
            poolChars.forEach((poolItem, idx) => {
                const btn = document.createElement('button');
                const usedClass = poolItem.used ? 'opacity-0 scale-50 pointer-events-none' : 'bg-gradient-to-br from-white to-gray-200 text-brand-dark hover:shadow-[0_5px_15px_rgba(236,72,153,0.4)] shadow-md hover:-translate-y-1';
                btn.className = 'w-10 h-12 md:w-12 md:h-14 rounded-xl text-xl md:text-2xl font-bold transition-all transform ' + usedClass;
                btn.textContent = poolItem.char;
                btn.onclick = () => selectLetter(idx);
                poolContainer.appendChild(btn);
            });
        }

        function selectLetter(poolIdx) {
            sfx.click(); // Phát âm thanh
            // Tìm vị trí ô chữ trống đầu tiên
            const emptyIdx = answerSlots.findIndex(s => !s.isSpace && !s.current);
            if(emptyIdx !== -1) {
                answerSlots[emptyIdx].current = poolChars[poolIdx].char;
                answerSlots[emptyIdx].poolIndex = poolIdx;
                poolChars[poolIdx].used = true;
                renderBoard();
                checkAnswer();
            }
        }

        function removeLetter(slotIdx) {
            const slot = answerSlots[slotIdx];
            if(slot.current && slot.poolIndex !== null) {
                sfx.click(); // Phát âm thanh
                poolChars[slot.poolIndex].used = false;
                slot.current = null;
                slot.poolIndex = null;
                renderBoard();
            }
        }

        function checkAnswer() {
            // Kiểm tra xem đã điền đủ ô chữ chưa
            const isFull = answerSlots.every(s => s.isSpace || s.current !== null);
            if(!isFull) return;

            // Kiểm tra tính chính xác
            const isCorrect = answerSlots.every(s => s.isSpace || s.current === s.expected);
            if(isCorrect) {
                sfx.correct(); // Phát âm thanh Đúng
                clearInterval(timerInterval);
                const earned = window.GAME_DATA[currentQuestionIdx].score;
                totalScore += earned;
                setTimeout(() => showQuestionResult(true, earned), 300);
            } else {
                sfx.wrong(); // Phát âm thanh Sai
                const container = document.getElementById('answer-slots');
                container.classList.add('animate-shake');
                setTimeout(() => container.classList.remove('animate-shake'), 400);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if(timeLeft <= 10) document.getElementById('timer').classList.replace('text-brand-pink', 'text-red-500');
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    sfx.wrong(); // Phát âm thanh sai khi Hết giờ
                    showQuestionResult(false);
                }
            }, 1000);
        }

        function showQuestionResult(isWin, earned = 0) {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('flex');
            const resScreen = document.getElementById('screen-result');
            resScreen.classList.remove('hidden');
            
            if(isWin) {
                document.getElementById('result-icon').textContent = '🎉';
                document.getElementById('result-title').textContent = 'CHÍNH XÁC!';
                document.getElementById('result-title').className = 'text-5xl font-bold text-green-400 text-glow title-font mb-4';
                document.getElementById('res-message').textContent = '+' + earned + ' ĐIỂM';
                document.getElementById('res-message').className = 'text-3xl text-brand-yellow font-bold mb-8 animate-bounce';
                fireConfetti();
            } else {
                document.getElementById('result-icon').textContent = '⏰';
                document.getElementById('result-title').textContent = 'HẾT GIỜ!';
                document.getElementById('result-title').className = 'text-5xl font-bold text-red-400 title-font mb-4';
                
                const correctStr = window.GAME_DATA[currentQuestionIdx].answer.toUpperCase();
                document.getElementById('res-message').textContent = 'Đáp án: ' + correctStr;
                document.getElementById('res-message').className = 'text-xl text-white bg-black/40 px-4 py-2 rounded-xl inline-block mb-8';
            }

            const btnNext = document.getElementById('btn-next');
            if(currentQuestionIdx < window.GAME_DATA.length - 1) {
                btnNext.textContent = 'Câu Tiếp Theo ➔';
                btnNext.onclick = () => {
                    resScreen.classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    document.getElementById('screen-game').classList.add('flex');
                    currentQuestionIdx++;
                    loadQuestion();
                };
            } else {
                btnNext.textContent = 'Xem Kết Quả Chung Cuộc 🏆';
                btnNext.onclick = showFinalSummary;
            }
        }

        function showFinalSummary() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-summary').classList.remove('hidden');
            document.getElementById('final-score').textContent = totalScore;
            fireConfetti();
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = [];
            const colors = ['#fde047', '#ec4899', '#06b6d4', '#10b981', '#a855f7'];

            for(let i=0; i<100; i++) {
                pieces.push({
                    x: canvas.width / 2, y: canvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 5, color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.rot += p.rotSpeed;
                    if(p.y < canvas.height) active = true;
                    ctx.save();
                    ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                });
                if(active) requestAnimationFrame(animate);
                else canvas.classList.add('hidden');
            }
            animate();
        }
    </script>
</body>
</html>
